<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBanque Mulhouse - Vérification de compte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="Logo.png" alt="eBanque Mulhouse" class="logo">
    <h1>eBanque Mulhouse</h1>
    <p class="subtitle">Accès en ligne sécurisé</p>
</header>

<main>
    <section class="card">
        <h2>Vérification de solde</h2>

        <form id="verifForm">
            <label>Numéro de compte :</label>
            <input type="text" required>

            <label>Code client :</label>
            <input type="password" required>

            <button type="submit">Vérifier</button>
        </form>

        <div id="resultat" class="hidden">
            <h3>Résultat :</h3>
            <p id="solde"></p>
        </div>
    </section>
</main>

<script src="script.js"></script>

<footer>
    © 2025 eBanque Mulhouse — Portail sécurisé
</footer>

</body>
</html>
